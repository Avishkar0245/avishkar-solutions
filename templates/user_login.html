{% extends "base.html" %}
{% block title %}Student Login | {{ site.name }}{% endblock %}

{% block content %}
<section class="block" style="padding-top: 2rem; max-width: 480px; margin: 0 auto;">
  <div class="section-header" style="text-align: center;">
    <span class="sub-title">WELCOME BACK</span>
    <h1>Student Login</h1>
    <p class="lead" style="margin: 0 auto 1.5rem;">Access your dashboard to submit projects and track review status.</p>
  </div>

  <div class="card" style="padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow-md);">
    <form method="POST" action="{{ url_for('user_login') }}">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="e.g. rahul@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>
      </div>

      <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: .85rem; margin-top: 1rem;">
        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
      </button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--mute); font-size: .95rem;">
      Don't have an account yet? <a href="{{ url_for('user_register') }}" style="font-weight: 700;">Sign up free</a>
    </p>
  </div>
</section>
{% endblock %}
